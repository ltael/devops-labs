# Версии
opensearch_version: "3.8.0"
opensearch_dashboards_version: "3.8.0"

# Куда ставить и где хранить данные
opensearch_install_root: /opt
opensearch_data_dir: /var/lib/opensearch
opensearch_log_dir: /var/log/opensearch

# Системные пользователи служб
opensearch_user: opensearch
opensearch_group: opensearch
opensearch_dashboards_user: opensearch-dashboards

# Параметры узла
opensearch_cluster_name: lab-cluster
opensearch_node_name: "{{ inventory_hostname }}"
opensearch_network_host: "0.0.0.0"
opensearch_http_port: 9200
opensearch_heap_size: 1g
opensearch_memory_lock: true
opensearch_extra_config: {}

# Пароль admin: задаётся через Vault, пустой по умолчанию (роль остановится на проверке)
opensearch_admin_password: ""

# Dashboards
opensearch_dashboards_host: "0.0.0.0"
opensearch_dashboards_port: 5601
opensearch_dashboards_server_user: kibanaserver
opensearch_dashboards_server_password: kibanaserver

# Проверка готовности
opensearch_healthcheck_retries: 30
opensearch_healthcheck_delay: 10
opensearch_healthcheck_accepted_statuses: [green, yellow]

# --- Лабораторная 2: ролевая модель ---
# Имя data stream для логов
opensearch_logs_data_stream: logs
# Версия шаблона индекса: увеличьте, чтобы роль обновила шаблон
opensearch_logs_template_version: 1
opensearch_logs_shards: 1
opensearch_logs_replicas: 0

# Пароли пользователей: задаются через Vault, пустые по умолчанию
opensearch_logs_writer_password: ""
opensearch_logs_reader_password: ""
opensearch_cluster_admin_password: ""

# Пользователи и их роли
opensearch_security_users:
  - username: logs_writer
    password: "{{ opensearch_logs_writer_password }}"
    role: lab_logs_writer
    description: Write-only access to the logs data stream
  - username: logs_reader
    password: "{{ opensearch_logs_reader_password }}"
    role: lab_logs_reader
    description: Read-only access to logs* indices
  - username: cluster_admin
    password: "{{ opensearch_cluster_admin_password }}"
    role: lab_cluster_admin
    description: Cluster monitoring and settings without data access
