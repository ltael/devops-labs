- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart opensearch
  ansible.builtin.systemd_service:
    name: opensearch
    state: restarted

- name: Restart opensearch-dashboards
  ansible.builtin.systemd_service:
    name: opensearch-dashboards
    state: restarted
